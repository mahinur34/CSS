<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Style</title>
</head>
<body>
    <h2 style="color: blue; background-color: bisque; text-align: center;">Inline Style</h2><!-- style ie css özellikleri eklemiş oluyoruz -->

     <!-- text alig : hizalama -->

    <p style="color: brown; text-align: justify;">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quas, numquam!,
        Lorem ipsum dolor sit amet consectetur adipisicing elit. <mark style="background-color: aquamarine;">numquam!,</mark>, 
        Lorem ipsum dolor sit amet <span style="font-size: larger; color: blueviolet;">consectetur adipisicing elit. Quas, numquam!,</span>
    </p>

    <div style="text-align: right; background-color: antiquewhite;">
        <a href="" style="text-align: center;">Link</a> <!-- text-align ortaya getirmez çünkü zaten bulunduğu alanı kapsıyor -->

        <!-- div içine alınca ortalanmış oldu, çünkü div block element -->

    </div>


</body>
</html>
