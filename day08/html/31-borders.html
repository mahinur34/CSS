<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        h1{
            border-left: 5px solid red;
            border-right: 5px solid red;
            text-align: center;
            width: 150px;
            margin: 30px auto ;
            letter-spacing: 3px; /* harfler arasına boşluk koyuyor */
        }

        button{
            background-color: blueviolet;
            padding: 10px 20px;
            margin: 10px;
        }

        .b1{
            border: 3px solid black;
        }

        .b2{
            border: 5px dashed blue;
        }

        .b3{
            border-top: 6px groove green;
            border-bottom: 6px groove green;
        }

        .b4{

            border:3px solid brown;
            border-radius: 50%; /* elips yaptı dış çerçeveyi */
        }

        .b5{
            border:3px solid purple;
            border-radius: 7px 0; /* saat yönünde */
        }

    </style>
</head>
<body>
    <h1>Borders</h1>

    <button class="b1">Hello World</button>
    <button class="b2">Hello World</button>
    <button class="b3">Hello World</button>
    <button class="b4">Hello World</button>
    <button class="b5">Hello World</button>
    
</body>
</html>
