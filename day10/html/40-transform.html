<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        .my-div {
            background-color: blue;
            width: 100px;
            height: 100px;
            transform: translate(50%, 30%); /* 50px ve 30px karşılık gelir. Çünkü width ve height 100px'dir. */
            /* positiondan farkı nedir?  */
        }

        img:hover {
            transform: translate(50px, 100px) rotate(180deg) scale(1.5, 1.5); /* scale :elementin genişliğini belirtmek için kullanılır  */
        }
    </style>
</head>
<body>
    <h2>Transform</h2>

    <div class="my-div"></div>

    <img src="../img/sunset-8331285_1280.jpg" alt="sunset" width="200px">
</body>
</html>

<!-- position Özelliği:
position özelliği, bir elementin sayfa üzerindeki konumunu belirlemek için kullanılır. Bu özellik, elementin konumunun nasıl hesaplanacağını belirler. 
Farklı position değerleriyle (örneğin: static, relative, absolute, fixed, sticky) elementin yerleşimi üzerinde kontrol sağlar.

static: Varsayılan konumlandırma türüdür. Element sayfa akışına göre yerleştirilir.
relative: Elementin konumu, normalde bulunduğu yerden kaydırılabilir. Bu kaydırma, diğer elementlerin düzenini etkilemez.
absolute: Element, en yakın position değeri olan (örn. relative, absolute, fixed, veya sticky) ebeveynine göre konumlandırılır.
fixed: Element, pencere boyutuna göre sabitlenir ve sayfa kaydırıldıkça hareket etmez.
sticky: Element, sayfa kaydırıldığında belirli bir noktada sabitlenir.
2. transform Özelliği:
transform özelliği, bir elementin şekli, boyutu veya konumunu değiştirmek için kullanılır. Bu özellik, elementin konumunu değiştirmez,
 ancak görünümünü manipüle eder. transform ile elementler döndürülebilir, ölçeklendirilebilir, kaydırılabilir veya eğilebilir.

translate(x, y): Elementi X ve Y ekseninde kaydırır.
rotate(deg): Elementi belirtilen açı kadar döndürür.
scale(x, y): Elementin boyutlarını değiştirir.
skew(x, y): Elementi eğik hale getirir.
Temel Farklar:
position: Elementin yerleşim (layout) düzenini etkiler, yani sayfa üzerindeki yerini belirler.
transform: Elementin görsel görünümünü değiştirir, ancak sayfa akışını etkilemez. Yani, transform ile yapılan işlemler, 
elementin etrafındaki diğer elemanları etkilemez. -->

<!-- transform ile yapılan boyut değişiklikleri sadece görsel olarak etkiler, elementin gerçek boyutlarını değiştirmez.
width ve height ile yapılan değişiklikler, elementin gerçek fiziksel boyutlarını değiştirir ve sayfa düzenindeki diğer elemanlarla etkileşimini etkiler. -->
