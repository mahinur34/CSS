<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yatay Hizalama</title>

    <style>
        main{
            background-color: aquamarine;
            padding: 50px;
            text-align: center;
        }

        div{
            background: rgb(50, 107, 157);
            width: 100px;
            margin: auto;/* sadece margin:auto özelliği olursa block elementi ortalar */
            margin-right: 0;/* sağa yaslar */ /* son yazılan margin öncekinin üzerine yazar, mainin içinde en sağa yasladı*/
        }

        span{
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <h2>Yatay Hizalama</h2>

    <main>
        <div>Block</div>
        <span>Inline</span>
    </main>
</body>
</html>
