<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ölçü Birimleri</title>
    <link rel="stylesheet" href="../css/13-style.css">
</head>
<body>
    <h2>Ölçü Birimleri</h2>


    <!-- px and % --> <!-- parent a göre -->
    <div class="box1">A</div>
    <div class="box2">
        <div class="box3">B</div>
    </div>

    <!-- vw and vh --> <!--  ekrana göre -->
     <div class="box4">C</div>
     <div class="box5">D</div>

     <br><hr><br>

     <!-- em : parent elemente bakar-->

     <div id="div1"> Lorem Ipsum div1
        <div id="div2"> Lorem Ipsum div2</div>
     </div>


     <!-- rem : root element(html) e göre kendisini ayarlar-->

     <div id="div3"> Lorem Ipsum div1
        <div id="div4"> Lorem Ipsum div2</div>
     </div>



</body>
</html>
