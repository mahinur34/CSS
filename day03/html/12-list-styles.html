<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LİST STYLES</title>

    <style>
        ul{
            list-style-type:"😊" ; /* listelemenin yanındaki işaretlri ayarlıyoruz */
           /* list-style-image: url();  html içinde olmadığımız için dosyaya ulaşamadık */
           list-style-position: inside; /*  bir içeride veya dışarıda olmasını istersek */
        }

        ol{

            list-style-type: decimal-leading-zero; /* 2 haneli sayılarda hizayı korumak için ,type kısmıını yazmassak da olur*/
            /*list-style-type: lower-roman; roma rakamıyla yazar*/
        }
    </style>
</head>
<body>
    
    <h2>List Styles</h2>

    <h3>Şehirler</h3>

    <ul>
        <li>İstanbul</li>
        <li>Ankara</li>
        <li>İzmir</li>
    </ul>

    <h3>Meyveler</h3>

    <ol>
        <li>Elma</li>
        <li>Armut</li>
        <li>Kiraz</li>
        <li>Muz</li>
    </ol>
</body>
</html>
