<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>

    <style>

div{
    width: 300px;
    height: 50px;
    display: inline;
}

span{
    width: 300px;
    height: 50px;
    display: inline-block;
}

b{
    width: 300px;
    height: 50px;
    display: block;
}

button{
    display: none;
}



    </style>
</head>
<body>
    <h2>Display</h2>

    <div style="background-color: yellow;">Hello World</div>
    <span style="background-color: blueviolet" ;>Hello World</span>
    <b style="background-color: palegreen";>Hello World</b>

    <button>Click</button>
</body>
</html>
