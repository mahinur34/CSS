<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>

    <style>
        .input-btn {
            display: inline-block;
            margin: 20px;
            position: relative;
        }

        .input-btn input {
            border: none;
            outline: none;
            background-color: rgb(54, 52, 52);
            color: whitesmoke;
            padding: 10px 20px;
            border-radius: 40px;
        }

        .input-btn button {
            background: linear-gradient(to right, orange, orangered);
            color: whitesmoke;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            position: absolute;
            top: 1px;
            right: 1px;
            bottom: 1.5px;
        }

        .input-btn button:hover {
            background: radial-gradient(circle, orange, orangered);
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <div class="input-btn">
        <input type="text">
        <button>Send</button>
    </div>
</body>
</html>
